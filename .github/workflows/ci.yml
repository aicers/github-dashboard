name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || (github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25

      # Fails when this repository's copy of the shared instruction blocks
      # stops matching the release `.agent-instructions.toml` pins --
      # because a generated region of AGENTS.md was edited here, or because
      # an update pull request was never merged. Running in this required
      # job makes a drift failure fail `Markdown` (and `CI Gate`).
      #
      # `@main`: the scripts are mechanism and come from wherever this
      # reference points, while the blocks are content and come from the
      # pin. No `with:` block, because the release to compare against and
      # the blocks to compare are both read from that one file.
      #
      # Guarded rather than left to the default `success()`, which would
      # skip it whenever the lint above failed: a drifted block is drift
      # whether or not some other Markdown file also breaks a lint rule.
      # `!cancelled()` rather than `always()`, because a cancelled run
      # should stop, and the `checkout` clause keeps a failed checkout from
      # being reported as drift.
      - name: Check shared instruction-block drift
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: aicers/agent-instructions/check-drift@main

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome
        run: biome ci --error-on-warnings .

      - name: Run Tailwind lint
        run: pnpm run lint:tailwind

      - name: Type check
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      APP_BASE_URL: http://127.0.0.1:3100
      GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
      GITHUB_ALLOWED_ORG: ${{ secrets.OAUTH_ALLOWED_ORG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate session secret
        run: |
          SESSION_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SESSION_SECRET"
          echo "SESSION_SECRET=$SESSION_SECRET" >> $GITHUB_ENV

      - name: Ensure Docker is ready
        run: |
          for attempt in {1..5}; do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon is ready."
              exit 0
            fi
            echo "Docker is not ready yet (attempt ${attempt}/5). Retrying in 5s..."
            sleep 5
          done
          echo "Docker daemon did not become ready in time." >&2
          exit 1

      - name: Run unit tests
        run: pnpm run test

      - name: Run database integration tests
        run: pnpm run test:db

      # Playwright's `--with-deps` installs system libraries through apt. This
      # step configures every apt run after it, Playwright's included: retry
      # each download three times, and fail `apt-get update` when any source
      # cannot be refreshed instead of only warning. The file is named to sort
      # after the hosted image's own `zz-retries` (`Acquire::Retries "1"`),
      # since apt applies `apt.conf.d` in name order and the last value wins.
      - name: Refresh apt package lists
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'APT::Update::Error-Mode "any";' \
            | sudo tee /etc/apt/apt.conf.d/zzz-ci-apt >/dev/null
          apt-config dump | grep -E '^(Acquire::Retries|APT::Update::Error-Mode) '
          sudo apt-get update -qq

      - name: Install Playwright Browser Dependencies
        timeout-minutes: 30
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

  image-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        run: docker build . --file Dockerfile --tag github-dashboard:test

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [markdown, check, test, image-build]
    if: ${{ always() }}
    steps:
      - name: Assert every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          bad="$(printf '%s' "${RESULTS}" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | "  \(.key): \(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "Not green:" >&2
            echo "${bad}" >&2
            exit 1
          fi
